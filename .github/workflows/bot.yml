name: Run Portfolio Bot

on:
  schedule:
    - cron: "0 13 * * *"   # 6 AM Pacific (13:00 UTC)
  workflow_dispatch:        # allows manual runs

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install yfinance
        pip install requests

    - name: Run bot
      env:
        AOL_EMAIL: ${{ secrets.AOL_EMAIL }}
        AOL_APP_PASSWORD: ${{ secrets.AOL_APP_PASSWORD }}
        SMS_ADDRESS: ${{ secrets.SMS_ADDRESS }}
      run: python bot.py


