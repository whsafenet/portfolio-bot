name: Run Portfolio Bot

on:
  schedule:
    - cron: "0 14 * * *"   # Runs every day at 6 AM Pacific (13:00 UTC)
  workflow_dispatch:       # Allows manual runs

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install yfinance requests

    - name: Run bot
      run: python bot.py

